<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="loadHandler(this)">불러오기</button>
    <table border="1" width="100%">
        <thead>
            <tr>
                <th>user-id</th>
                <th>id</th>
                <th>title</th>
                <th>completed</th>
            </tr>
        </thead>
        <tbody id="todo-list-area"></tbody>
    </table>

    <script>
        function myGet(url, callback) {
            const xhr = new XMLHttpRequest();
            xhr.callback = callback;
            xhr.onload = function(e) {
                xhr.callback(e.target.responseText)
            }
            xhr.open('get', url, true);
            xhr.send();
        }

        function loadHandler(target) {
            const url = "https://jsonplaceholder.typicode.com/todos";
            myGet(url, function(data){
                let userList = JSON.parse(this.responseText.trim());
                // html 화면에 table 그리기
                let html = "";
                userList.forEach(e => {
                    html += `<tr><td>${e.userId}</td><td>${e.id}</td>
                            <td>${e.title}</td><td>${e.completed}</td></tr>`;
                });
                document.getElementById("todo-list-area").innerHTML = html;
            });
        }
    </script>
</body>
</html>
