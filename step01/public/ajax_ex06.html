<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <button onclick="loadHandler(this)">불러오기</button>
    <table border="1" width="100%">
        <thead>
            <tr>
                <th>user-id</th>
                <th>id</th>
                <th>title</th>
                <th>completed</th>
            </tr>
        </thead>
        <tbody id="todo-list-area"></tbody>
    </table>

    <script>
        function loadHandler(target) {
            const url = "https://jsonplaceholder.typicode.com/todos";
            fetch('https://jsonplaceholder.typicode.com/todos')
                .then((response) => response.json())
                .then((userList) => {
                    let html = "";
                    userList.forEach(e => {
                        html += `<tr><td>${e.userId}</td><td>${e.id}</td>
                                <td>${e.title}</td><td>${e.completed}</td></tr>`;
                    });
                    document.getElementById("todo-list-area").innerHTML = html;
                });
        }
    </script>
</body>
</html>
