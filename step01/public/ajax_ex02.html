<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Ajax 통신 연습</h1>
    <p>
        User: <input type="text" id="user" value="길동이"><br>
        Message: <input type="text" id="message" value="만사형통"><br>
        <button id="reqBtn">요청</button>
    </p>
    <div id="resultBox">
        <ul>
            <li>user: <sapn></sapn></li> | <li>message: <span></span></li>
        </ul>
    </div>

    <script>
        const xhr = new XMLHttpRequest();
        const resultList = document.querySelectorAll("#resultBox li");
        // console.dir(resultList);
        const reqBtn = document.querySelector("#reqBtn");

        xhr.onload = function(e) {
            let resObj = JSON.parse(e.target.responseText);
            // console.log(resObj.user);
            resultList[0].firstElementChild.innerHTML = resObj.user;
            resultList[1].firstElementChild.innerHTML = resObj.message;
        }

        // 클릭하면 Ajax 작동
        // 스스로 해보기
        // input의 데이터를 가져와 쿼리스트링 값으로 사용하기
        // user input, message input DOM 셀렉트하기
        // input의 값을 가져와서 쿼리스트링으로 만들기

        const user = document.querySelector("#user");
        const message = document.querySelector("#message");

        reqBtn.onclick = function(e) {
            xhr.open("get", `/data?user=${user.value}&message=${message.value}`, true);
            xhr.send();
        }

    </script>
</body>
</html>
